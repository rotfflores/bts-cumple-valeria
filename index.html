<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080225" />
    <meta name="description" content="Una noche para brillar juntos. 14 de noviembre de 2026." />
    <title>Cumpleaños de Valeria</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile-fix.css" />
  </head>
  <body>
    <main class="invitation-page">
      <section class="invitation-hero" aria-label="Invitación de cumpleaños de Valeria">
        <img class="hero-image" src="public/bts-birthday-hero.png" alt="Siete personajes frente a un corazón luminoso en un concierto morado" />
        <div class="hero-shade" aria-hidden="true"></div>
        <div class="invitation-copy">
          <h1 class="birthday-name">Valeria</h1>
        </div>
      </section>
      <section class="date-card" aria-label="Fecha de la celebración">
        <span class="date-label">Celebremos juntos</span>
        <time datetime="2026-11-14">
          <strong>14</strong><span class="date-divider" aria-hidden="true"></span>
          <span class="date-month">Noviembre</span><span class="date-year">2026</span>
        </time>
      </section>
    </main>
  </body>
</html>
